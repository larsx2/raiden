[package]
name = "raiden-core"
version = "0.1.0"
description = "What the Raiden launcher does apart from drawing: search, extensions, settings and approvals."
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
toml_edit = "0.25"
regex = "1"
serde_json = "1"
unicode-normalization = "0.1"
memchr = "2"
