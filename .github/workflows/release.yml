name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main and matches the version
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but Cargo.toml says $version."
            exit 1
          fi

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: false

      - name: Check Cargo.lock matches Cargo.toml
        run: |
          if ! mise x -- cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::error::Cargo.lock is out of date. Run mise x -- cargo check and commit it."
            exit 1
          fi

      - run: mise run lint
      - run: mise run test

  build:
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: false

      - run: mise run setup
      - run: mise x -- sh scripts/release.sh build
      - run: ditto -c -k --keepParent target/release/bundle/macos/Raiden.app "$RUNNER_TEMP/Raiden.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/Raiden.zip
          retention-days: 7

  sign:
    needs: build
    runs-on: macos-15
    timeout-minutes: 150
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check no release exists for the tag yet
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME already has a published release, so this run signs nothing."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}

      - name: Unpack the unsigned app
        run: |
          mkdir -p target/release/bundle/macos
          ditto -x -k "$RUNNER_TEMP/Raiden.zip" target/release/bundle/macos

      - name: Load the signing certificate and the notary key
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          for secret in DEVELOPER_ID_CERTIFICATE DEVELOPER_ID_CERTIFICATE_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER; do
            if [ -z "$(printenv "$secret")" ]; then
              echo "::error::The release environment has no $secret secret. CONTRIBUTING.md says what it holds."
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          (umask 077 && printf '%s' "$DEVELOPER_ID_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12")
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          (umask 077 && printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8")

      - name: Sign and notarize
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: sh scripts/release.sh sign

      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"

      - name: Keep the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raiden
          path: target/dist/
          retention-days: 7

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          releases="repos/$GITHUB_REPOSITORY/releases"
          sh scripts/release-notes.sh "$tag" > "$RUNNER_TEMP/notes.md"
          gh api "$releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id" |
            while read -r old; do
              gh api -X DELETE "$releases/$old"
            done
          prerelease=false
          case "$tag" in
            *-*) prerelease=true ;;
          esac
          id="$(gh api -X POST "$releases" -f tag_name="$tag" -f name="Raiden ${tag#v}" \
            -F draft=true -F prerelease="$prerelease" -F body=@"$RUNNER_TEMP/notes.md" --jq .id)"
          : > "$RUNNER_TEMP/expected"
          for file in target/dist/*.dmg target/dist/*.sha256; do
            name="$(basename "$file")"
            gh api -X POST "https://uploads.github.com/$releases/$id/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$file" > /dev/null
            echo "$name sha256:$(shasum -a 256 "$file" | cut -d ' ' -f 1)" >> "$RUNNER_TEMP/expected"
          done
          expected="$(sort "$RUNNER_TEMP/expected" | paste -sd ',' -)"
          held() {
            gh api "$releases/$id/assets" --jq '[.[] | "\(.name) \(.digest)"] | sort | join(",")'
          }
          if [ "$(held)" != "$expected" ]; then
            echo "::error::The draft does not hold exactly the files this run made, so it stays unpublished."
            exit 1
          fi
          gh api -X PATCH "$releases/$id" -F draft=false > /dev/null
          published="$(gh api "$releases/tags/$tag" --jq '"\(.id) \(.author.login) \(.immutable)"')"
          if [ "$published" != "$id github-actions[bot] true" ] || [ "$(held)" != "$expected" ]; then
            echo "::error::The published $tag release is not exactly the one this run made, locked: $published"
            exit 1
          fi

  provenance:
    needs: sign
    if: github.ref_type == 'tag' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: raiden
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg
