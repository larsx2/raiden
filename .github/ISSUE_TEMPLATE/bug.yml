name: Bug
description: Something in Raiden doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, from opening Raiden, that show the problem.
      placeholder: |
        1. Press ⌥Space
        2. Type ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Raiden version
      description: The commit you built from. `git rev-parse --short HEAD` in your clone shows it.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5 on Apple silicon
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, recordings or logs. Remove anything private first.
