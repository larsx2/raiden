name: Idea
description: Something Raiden could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or moment where Raiden falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What Raiden could do
      description: How you'd like it to work, keys included.
    validations:
      required: true
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I'd like to build this myself, once a maintainer agrees it's wanted.
