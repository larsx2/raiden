[package]
name = "raiden"
version = "0.1.0"
description = "A launcher for this Mac: apps, AI answers and extensions on ⌥Space."
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
raiden-core = { path = "core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-nspanel = "2.1"
tauri-plugin-global-shortcut = "2"
core-foundation = "0.10"
core-graphics = "0.25"
foreign-types = "0.5"
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSColor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSOperation", "NSString", "NSURL"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }
base64 = "0.22"
serde = "1"
agent-client-protocol = "=5.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["codec", "compat"] }
futures = "0.3"
serde_json = "1"
plist = "1"
sha2 = "0.10"

[workspace]
resolver = "3"
members = ["core"]

[workspace.package]
edition = "2024"
repository = "https://github.com/larsx2/raiden"
license = "MIT"
publish = false
